<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Canvas drawing</title>
  <link href="https://fonts.googleapis.com/css?family=Playfair+Display:400,400i,700,700i%7cWork+Sans:400,500,700" rel="stylesheet" type="text/css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  
  <style>
    .widget-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 100vh;
      margin: auto;
    }

    .widget {
      background-color: #f0f0f0;
      width: 30%;
      height: 60vh;
      width: 30vw;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      position: relative;
      padding: 10px;
    }

    .widget iframe {
      width: 100%;
      height: 100%;
    }

    .refresh-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 5px 10px;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    /* Control the display order */
    .display-widget {
      order: 1;
    }

    .moderate-widget {
      order: 2;
    }

    .draw-widget {
      order: 3;
    }

    body {
      background-color: rgb(0, 0, 0);
    }

  </style>
</head>

<body class="fullcontainer">
  <div id="main" class="pinkcontainer">
    <div>
      <navbarog class="navbar-contentsog">
        <div class="text-over-image">
          <a href="index.html#main">
            <img class="explodelogo" src="assets/images/explosion_bubble.webp" alt="" width="150">
            <span id="logo-text" class="header centered-text">katie <3</span>
          </a>
        </div>
      </navbarog>
    </div>

    <div class="widget-container">
      <!-- Display widget -->
      <div class="widget display-widget">
        <iframe id="display-iframe" src="https://katiem120598.github.io/flowJockey_display/" allow="microphone"></iframe>
      </div>

      <!-- Moderate widget -->
      <div class="widget moderate-widget">
        <iframe id="moderate-iframe" src="https://katiem120598.github.io/flowJockey_perform/"></iframe>
      </div>

      <!-- Draw widget (loaded last with JavaScript) -->
      <div class="widget draw-widget">
        <iframe id="draw-iframe" src=""></iframe>
      </div>
    </div>
    <!-- Add body text beneath the iframes-->

    <script src="assets/js/projectMenu.js"></script>
    <script src="assets/js/girlypop.js"></script>

    <!-- JavaScript to delay loading of the draw iframe -->
    <script>
window.onload = function () {

  setTimeout(() => {
    document.getElementById('moderate-iframe').src = "https://katiem120598.github.io/flowJockey_perform/";
    document.getElementById('draw-iframe').src = "https://katiem120598.github.io/flowJockey_draw/";
  }, 1000);

  const displayIframe = document.getElementById("display-iframe");

  displayIframe.onload = function () {
    console.log("Display iframe loaded â€” waiting for its JS to initialize...");

    const fw = displayIframe.contentWindow;

    // Poll until p5.js finishes setting up and console.log stops changing
    const hookInterval = setInterval(() => {

      if (!fw || !fw.console) return;

      const currentLog = fw.console.log;

      // If it's already our wrapped version, stop
      if (currentLog._isHooked) return;

      // Replace console.log
      const orig = currentLog;
      const wrapped = function (...args) {
        orig.apply(fw.console, args);

        if (args.join(" ").includes("âœ” Playing 757 track")) {
          console.warn("ðŸ”¥ DETECTED TRACK EVENT");
          alert("found it!");
        }
      };
      wrapped._isHooked = true;

      fw.console.log = wrapped;

      console.log("ðŸŽ‰ Successfully hooked console.log inside iframe!");
      clearInterval(hookInterval);

    }, 200);  // check every 200ms until ready
  };
};


    </script>

  </div>


</body>
