            <div
            data-project-id="closer"
            data-project-title = "closer"
            data-project-desc="<i>Closer</i> is an interactive light installation that visualizes the emotional and spatial dynamics between people through proximity-based illumination. 
            Built with ultrasonic distance sensors and Arduino-controlled individually programmable string lights connected to fiber-optic cables, the piece responds to the physical distance between two participants. 
            As individuals move nearer to each other, the lights in between them remain illuminated while the ones they have passed turn off, emphasizing the space between them.
            In addition, a rotary encoder allows participatns to adjust the color temperature of the lights to indicate their level of comfort with the space between themselves and the other person."
            data-project-link = "https://youtu.be/EWQtuBCWWr0"
            data-project-linktitle = "view project details →"
            data-project-modal-img="assets/images/closer2.jpg"

            data-project-id="reflected-identities"
            data-project-title = "reflected identities"
            data-project-desc="<i>Reflected Identities</i> is an interactive installation that explores how personal identity becomes fragmented, distorted, and reshaped through the perceptions of others. 
            The piece layers multiple visual projections, each representing a different version of the self, and reflects them through a rotating mirror mechanism controlled by Arduino-driven ultrasonic sensors and servo motors. 
            As viewers move through the space, their proximity triggers the mirrors to shift, causing the projected identities to fragment, overlap, or disappear entirely. 
            The result is a constantly shifting visual field that mirrors the instability of self-perception and the external pressures that warp it.

            <br><br>By allowing physical movement to directly influence which identity is visible or obscured, the installation turns the viewer into an active participant in the construction and deconstruction of their own reflection. 
            The rotating mirrors scramble and reorient the projections, creating moments where multiple selves collide and others where the viewer cannot locate a clear reflection at all. 
            This instability speaks to the difficulty of maintaining a coherent sense of self amid competing labels, expectations, and judgments. 
            Through its combination of sensor-driven mechanics and symbolic visual layering, <i>Reflected Identities</i> transforms the politics of selfhood into a spatial, dynamic, and embodied experience."
            data-project-link = "https://issuu.com/katherinemueller/docs/identity_responsive_environment" 
            data-project-linktitle = "view project details →"
            data-project-modal-img="assets/images/reflected_identities2.png"
            data-project-modal-alt="reflected identities preview"
            data-project-modal-scale="100"
            data-project-skills="TouchDesigner, audio-reactive shaders, CRT routing"
            class="filler-container"

            data-project-id="led-array"
            data-project-title = "led pixel array!!"
            data-project-desc="I developed a network-addressable LED pixel array system using an ESP32 running WLED, configured in both AP mode and local Wi-Fi mode for testing. 
            The LED strip was mapped as a 2D pixel grid inside WLED, allowing each diode to be addressed by index. 
            I built a TouchDesigner to WLED control pipeline where TouchDesigner generated real-time RGB values based on audio input, FFT analysis, and glitch-processing operators. 
            These values were formatted into network packets and sent through a Python DAT to the ESP32’s WLED JSON/UDP interfaces. 
            The system dynamically pushed per-pixel color data at runtime, overriding WLED’s onboard presets and enabling fully custom animations.

            <br><br>To support stable communication, I worked through IP configuration, AP network inconsistencies, and LED power management, ultimately establishing a reliable method for sending live data frames from TouchDesigner to WLED. 
            I implemented a mapping workflow using DAT tables and CHOP channels to convert TouchDesigner’s internal coordinates into LED indices, ensuring consistent pixel-to-grid alignment. 
            This project gave me hands-on experience with addressable LEDs, network protocols, real-time visual systems, and hardware–software integration, and serves as a foundation for scaling to multi-device, multi-display installations."
            data-project-modal-localvideo="assets/images/led_vid.mp4"
            data-project-modal-alt="led pixel array preview"
            data-project-modal-scale="50"
            data-project-skills="ESP32 (WLED firmware), TouchDesigner, Python, JSON API control for WLED, LED pixel mapping, network configuration, audio-reactive visuals"
            class="filler-container"

            data-project-id="drop-earrings"
            data-project-title = "drop earrings"
            data-project-desc="This project explores the full workflow from digital modeling to physical metal casting. 
            The design began as a reinterpretation of a pair of earrings I found online, which were modeled in Rhino and then CNC-milled into a wax block to create a positive form. 
            From the wax, a silicone mold was produced, allowing molten metal to be poured and cast into the final shapes. After cooling, the metal pieces were cleaned, separated, and finished with soldered earring posts to create a wearable pair."

            <div
            data-project-id="hard-reset"
            data-project-desc="<i>Hard Reset: Dancing Through the Noise</i> is an audiovisual installation and one-night gathering that used glitch as both medium and method for rethinking public assembly in an era defined by algorithmic fragmentation. 
            Drawing from Hannah Arendt’s notion that a public is formed whenever people “see what we see and hear what we hear,” the project asks what it means to make a shared reality when our digital lives are increasingly personalized, polarized, and averaged. 
            Glitch becomes the counterforce: an interruption of clean algorithmic legibility, a refusal of seamless interfaces, and an opportunity to locate joy, presence, and relationality in the midst of uncertainty, aligning with Adrienne Maree Brown’s concept of pleasure activism.
            Inspired by the lineage of Rosa Menkman, Nam June Paik, and early net-art interventions, <i>Hard Reset</i> reframes malfunction as meaning-making. 
            Error becomes a site of collective verification: a place where people can witness themselves and each other in the same distorted frame.

            <br><br>The installation translated movement and sound into a real-time ecosystem of pixel sorting, databending, cache-to-live comparisons, and generative AI transitions, all displayed across CRT televisions and projectors. 
            Visuals glitched harder as the crowd moved more, making dancing not ornamental but instrumental, serving as an embodied trigger for visibility. 
            When no one moved, the screens fell to static, underscoring the project’s central claim: there is no public without participation. 
            A last-minute venue change, the collapse of planned lighting elements, and an unexpected line-dancing segment introduced their own forms of glitch into the night, revealing the generative potential of disruption. 
            What emerged was not just a party, but a temporary public assembled through noise, error, and collective pleasure. 
            In an age of curated solitudes and algorithmically enforced sameness, Hard Reset positions glitch as a strategy for reorientation - an insistence that something new becomes possible when we dance through the noise rather than trying to escape it."
            data-project-title="hard reset: <br>dancing through the noise"
