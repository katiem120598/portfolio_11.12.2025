            data-project-id="drawing-app"
            data-project-title = "drawing app"
            data-project-desc="This drawing app is an experimental sketching environment built in p5.js where every drawn shape becomes an autonomous, living object. 
            Users draw freeform “blobs” directly on the canvas, and the app converts each stroke into a closed geometric shape with its own velocity, deformation behavior, and collision logic. 
            Each shape bounces off the canvas edges, wiggles organically using randomized oscillation factors, and reacts to nearby shapes through a custom overlap-detection system that pushes intersecting blobs apart. 
            The user can dynamically change the background color, delete shapes on click, or retroactively fill any shape with a chosen color.

            <br><br>Under the hood, the system maintains parallel arrays of geometry, motion vectors, scale oscillators, and color assignments to give every shape independent behavior. 
            A custom point-in-polygon algorithm enables accurate hit-testing, while a frame-based deformation engine produces the soft, amoeba-like morphing effect. 
            By combining drawing with physics and procedural animation, the app turns simple sketches into a moving ecosystem of interacting forms, making it useful as a tool for visual experimentation, creative play, or generative art prototyping."
            data-project-link = "drawingapp.html" 
            data-project-modal-video="https://www.youtube.com/embed/yV0Wu_lu7Cs?si=AbavLpyqSNYE4tQr"
            data-project-modal-alt="drawing app preview"
            data-project-modal-scale="50"
            data-project-skills="p5.js, HTML/CSS/JavaScript, computational geometry, procedural animation"
            class="filler-container" 
            data-top="14" 
            data-left="56" 
            data-width="40" 
            data-height="40">
                <img src="assets/images/drawing_app_wbackground.png" class="filler-image" alt="Description of the image">
            </a>
            <a 
            data-project-id="flow-jockey"
            data-project-title = "flowJockey"
            data-project-desc="flowJockey is an interactive, multi-client drawing system that transforms audience input into audio-reactive visuals. 
            I built it as a way to let people co-create a shared visual environment, whether during a performance, a party, or an installation. 
            Participants can open the drawing link on any device, sketch directly on their screen, and instantly see their shapes appear on the central display. 
            A custom Node WebSocket server synchronizes all clients in real time, assigns each participant a unique grid cell, and streams their drawings into the visualization engine. 
            The system includes three display modes (grid, party, and color), each driven by FFT analysis of incoming audio—bass, mid, and treble frequencies.
            The different display modes dynamically distort, move, or recolor every user-generated shape.

            <br><br>Beyond being fun and chaotic, flowJockey is useful as a tool for audience engagement, generative visual performance, and participatory art. 
            It removes the barrier between artist and viewer by turning everyone into a contributor. 
            The ability of the visuals to react to sound - whether a microphone feed or a pre-loaded track - allows flowJockey to adapt to concerts, DJ sets, exhibitions, or ambient environments.
            In addition, the simplicity of the sliders for the moderation screen allows the moderator to easily adjust the visual intensity and behavior on the fly, tailoring the experience to the energy of the crowd without stress. 
            I designed it to be flexible, scalable (25+ simultaneous drawers), and portable: everything runs in the browser, requires no downloads, and can be embedded into any event setup. 
            flowJockey becomes a living, evolving image of the crowd itself, capturing how people draw, move, and interact with the space in real time."
            data-project-link = "flowjockey.html" 
            data-project-modal-video="https://www.youtube.com/embed/0QbZ1kK8HBE?si=mxxP_uxmr6o8MYTi"
            data-project-modal-alt="flowJockey preview"
            data-project-modal-scale="100"
            data-project-skills="p5.js, Node.js, WebSockets, HTML/CSS/JavaScript, Web Audio API, Render.com"
            class="filler-container"
