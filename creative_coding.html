            <a
            data-project-id="in-motion"
            data-project-title = "in motion"
            data-project-desc="This project visualizes choreography by translating a dancer’s physical movement into a dynamic animation. 
            Using motion-tracking data captured from the dancer’s hand coordinates, the movement paths were imported into Rhino and processed through custom C# components in Grasshopper to generate a series of animated spheres. 
            Each sphere follows the dancer’s exact gesture trajectories, while color and form shift according to an audio analysis of the music driving the performance, clearly differentiating the two different genres used. 
            The result is a layered motion portrait that is part data visualization, part choreography, part ambient art.

            <br><br>The piece blurs the boundary between dance and computation. 
            It transforms embodied movement into digital behavior, turning rhythm, style, and gesture into visual patterns that unfold in synchrony with the performance. 
            Through the process of going from motion capture to geometric processing to parametric animation, this work explores how technology can extend, reinterpret, and archive the expressive language of the body."
            data-project-modal-video="https://www.youtube.com/embed/5pn_BieUFNs?si=DkNLJbVAcRP1F9O_"
            data-project-modal-alt="in motion preview"
            data-project-modal-scale="50" 
            data-project-skills="Rhino 3D, Grasshopper, C#, motion capture, data visualization"
            class="filler-container" 
            data-top="2"

            data-width="40"

            <a
            data-project-id="intl-style"
            data-project-title = "ml in the international style"
            data-project-desc="For this project, our team explored how machine learning can identify cultural identity in architecture by comparing traditional regional styles with the International Style across multiple centuries. 
            We began by building our own image dataset from scratch, collecting and curating architectural photographs from Japan, Korea, China, India, and Europe, alongside a contrasting dataset of International Style buildings. 
            This required sourcing, labeling, standardizing, and preprocessing hundreds of images to create clean training sets for each stylistic category. Using these datasets, we developed a series of PyTorch image-classification models, including generic, black-and-white, and detail-sensitive variants, to test how color, texture, and compositional features influence the model’s ability to recognize regional identity. 
            We then extended our analysis to architecture from 1800–2020 to examine how political, historical, and cultural shifts aligned with rising or fading stylistic distinctiveness.

            <br><br>My personal contribution included the majority of the coding and technical implementation. This includes the dataset preprocessing pipeline, model architecture setup, training routines, accuracy evaluation, and the “plug-and-play” classifier that allows users to swap out portions of an image on a web cam to see how it impacts regional classification in real time.
            I also built the system used to generate “regional infill” visualizations (hybrid images created by sampling the classifier’s most predictive regions) and reclassified both the originals and modified versions to study how each transformation affected cultural legibility. 
            Our results showed that some regions (e.g., Japan, China, Europe) became more distinct when generatively modified, while others (India, Korea) shifted in unexpected ways. 
            Overall, the project merges machine learning, architectural history, and visual analysis to ask whether modern globalized architecture still retains readable cultural identity, or whether everything is quietly converging toward a universal aesthetic."
            data-project-link = "https://issuu.com/katherinemueller/docs/muellerhlaingzhao_ml_final_presentation_1_"
            data-project-linktitle = "view full project →"
            data-project-modal-img="assets/images/intl_style2.png"
            data-project-modal-alt="international style preview"
            data-project-modal-scale="100"
            data-project-skills="Python, PyTorch, PIL, OpenCV, Torchvision, NumPy, Matplotlib"
            class="filler-container" 
            data-top="50" 
            data-left="2" 
            data-width="42" 
            data-height="46">
                <img src="assets/images/intl_style_wbackground.png" class="filler-image" alt="Description of the image">
            </a>
            <a
            data-project-id="rising-waters"
            data-project-title = "rising waters"
            data-project-desc="<i>Rising Waters</i> is a computational visualization of projected sea-level rise in Boston, built using Rhino and Grasshopper as both a modeling and animation environment. 
            Using an equation published by the U.S. Army Corps of Engineers, the team translated climate-impact data into a parametric system that dynamically models sea-level rise over time. 
            The model animates these shifts within Rhino, creating a spatial and temporal portrait of how rising water levels reshape the city’s shoreline.

            <br><br>To extend Grasshopper’s capabilities, the project used Rhino 8 beta’s live bake feature and a custom Python script that automated texture variation across frames. 
            The script looped through water-surface texture maps stored locally and fed them into an Image Sampler component, allowing the water material to change gradually as the animation progressed. 
            This data-driven geometry, parametric deformation, live baking, and automated texture cycling produced a fluid, interpretive visualization of climate change that connects scientific projections with computational design tools."
            data-project-link = "https://issuu.com/katherinemueller/docs/rising_waters_presentation_.pptx" 
            data-project-linktitle = "view project details →"
            data-project-modal-video="https://www.youtube.com/embed/ocPSCuT2UuE?si=zcJed1hCiaBJi9cR"
            data-project-modal-alt="rising waters preview"
            data-project-modal-scale="50"
            data-project-skills="Rhino 3D, Grasshopper, Rhino 8 beta, Python (RhinoScript)"
            class="filler-container" 
            data-top="54" 
            data-left="54" 
            data-width="45"

            </a>
            <a
            data-project-id="harmony-hero"
            data-project-title = "harmony hero"
            data-project-desc="<i>Harmony Hero</i> is an interactive pitch-training game inspired by the mechanics of Guitar Hero and classic singing games. 
            Built in Python using the Kivy framework, the app listens to the user’s singing in real time, detects pitch through an audio-analysis pipeline, and visually responds with dynamic bars, cues, and color changes that reflect how closely the user matches the target notes. 
            The interface functions as both a learning tool and a play experience, turning vocal accuracy into a rewarding, game-like feedback loop.

            <br><br>The project was developed using object-oriented programming to structure the game logic, audio processing, UI elements, and scoring system. 
            I designed and implemented all of the visual classes, creating the animated bar components, layout behaviors, and real-time visual feedback system that ties musical performance to on-screen motion. 
            By combining live audio input, pitch detection algorithms, and a custom visual layer, Harmony Hero transforms vocal practice into an intuitive and engaging audiovisual experience."
            data-project-modal-video = "https://www.youtube.com/embed/GJQs-gEq1ys?si=4IdH3qSrOXuYzz1e"
