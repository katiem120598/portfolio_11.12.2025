            data-project-id="intl-style"
            data-project-title = "ml in the international style"
            data-project-desc="For this project, our team explored how machine learning can identify cultural identity in architecture by comparing traditional regional styles with the International Style across multiple centuries. 
            We began by building our own image dataset from scratch, collecting and curating architectural photographs from Japan, Korea, China, India, and Europe, alongside a contrasting dataset of International Style buildings. 
            This required sourcing, labeling, standardizing, and preprocessing hundreds of images to create clean training sets for each stylistic category. Using these datasets, we developed a series of PyTorch image-classification models, including generic, black-and-white, and detail-sensitive variants, to test how color, texture, and compositional features influence the model’s ability to recognize regional identity. 
            We then extended our analysis to architecture from 1800–2020 to examine how political, historical, and cultural shifts aligned with rising or fading stylistic distinctiveness.

            <br><br>My personal contribution included the majority of the coding and technical implementation. This includes the dataset preprocessing pipeline, model architecture setup, training routines, accuracy evaluation, and the “plug-and-play” classifier that allows users to swap out portions of an image on a web cam to see how it impacts regional classification in real time.
            I also built the system used to generate “regional infill” visualizations (hybrid images created by sampling the classifier’s most predictive regions) and reclassified both the originals and modified versions to study how each transformation affected cultural legibility. 
            Our results showed that some regions (e.g., Japan, China, Europe) became more distinct when generatively modified, while others (India, Korea) shifted in unexpected ways. 
            Overall, the project merges machine learning, architectural history, and visual analysis to ask whether modern globalized architecture still retains readable cultural identity, or whether everything is quietly converging toward a universal aesthetic."
            data-project-link = "https://issuu.com/katherinemueller/docs/muellerhlaingzhao_ml_final_presentation_1_"
